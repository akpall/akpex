---
variant: flatcar
version: 1.1.0

passwd:
  users:
    - name: core
      ssh_authorized_keys:
        - ${SSH_AUTHORIZED_KEY}

storage:
  directories:
    - path: /etc/kubernetes
      mode: 0755
      user:
        name: root
      group:
        name: root
    - path: /etc/kubernetes/pki
      mode: 0755
      user:
        name: root
      group:
        name: root
    - path: /etc/kubernetes/admission
      mode: 0755
      user:
        name: root
      group:
        name: root
    - path: /etc/kubernetes/encryption
      mode: 0755
      user:
        name: root
      group:
        name: root
    - path: /var/log/apiserver
      mode: 0700
      user:
        name: root
      group:
        name: root

  files:
    # /etc/hostname
    - path: /etc/hostname
      contents:
        inline: ${HOSTNAME}
    # /etc/systemd/network/00-${INTERFACE}.network
    - path: /etc/systemd/network/00-${INTERFACE}.network
      contents:
        inline: |
          [Match]
          Name=${INTERFACE}

          [Network]
          DNS=${DNS}
          Address=${IP}/${CIDR}
          Gateway=${GATEWAY}
    - path: /etc/sysctl.d/99-haproxy.conf
      mode: 0644
      contents:
        inline: |
          net.ipv4.ip_nonlocal_bind = 1
    - path: /etc/kubernetes/pki/ca.crt
      mode: 0644
      contents:
        inline: |
          ${indent(10, KUBERNETES_CA_CRT)}
    - path: /etc/kubernetes/pki/ca.key
      mode: 0600
      contents:
        inline: |
          ${indent(10, KUBERNETES_CA_KEY)}

    - path: /etc/kubernetes/audit-policy.yaml
      mode: 0600
      contents:
        inline: |
          apiVersion: audit.k8s.io/v1
          kind: Policy
          rules:
            - level: Metadata
              resources:
                - group: ""
                  resources: ["secrets", "configmaps"]
                - group: "authentication.k8s.io"
                  resources: ["tokenreviews"]
            - level: Metadata
              resources:
                - group: ""
                  resources:
                    - pods/exec
                    - pods/portforward
                    - pods/proxy
                    - services/proxy
            - level: RequestResponse
              verbs: ["create", "update", "patch", "delete", "deletecollection"]
              resources:
                - group: ""
                  resources: ["pods"]
                - group: "apps"
                  resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
            - level: Metadata
              omitStages:
                - RequestReceived
    - path: /etc/kubernetes/kubeadm-config.yaml
      mode: 0600
      contents:
        inline: |
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: ClusterConfiguration
          apiServer:
            extraArgs:
              - name: kubelet-certificate-authority
                value: /etc/kubernetes/pki/ca.crt
              - name: profiling
                value: "false"
              - name: audit-log-path
                value: /var/log/apiserver/audit.log
              - name: audit-log-maxage
                value: "30"
              - name: audit-log-maxbackup
                value: "10"
              - name: audit-log-maxsize
                value: "100"
              - name: audit-policy-file
                value: /etc/kubernetes/audit-policy.yaml
              - name: request-timeout
                value: "300s"
              - name: service-account-extend-token-expiration
                value: "false"
              - name: anonymous-auth
                value: "false"
              - name: enable-admission-plugins
                value: "DenyServiceExternalIPs,NodeRestriction,EventRateLimit,AlwaysPullImages"
              - name: tls-cipher-suites
                value: "TLS_AES_128_GCM_SHA256,TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305,TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256"
              - name: admission-control-config-file
                value: /etc/kubernetes/admission/admission-control-config.yaml
              - name: encryption-provider-config
                value: /etc/kubernetes/encryption/encryption-config.yaml
            extraVolumes:
              - name: admission-config
                hostPath: /etc/kubernetes/admission
                mountPath: /etc/kubernetes/admission
                readOnly: true
                pathType: DirectoryOrCreate
              - name: encryption-config
                hostPath: /etc/kubernetes/encryption
                mountPath: /etc/kubernetes/encryption
                readOnly: true
                pathType: DirectoryOrCreate
              - name: audit-policy
                hostPath: /etc/kubernetes/audit-policy.yaml
                mountPath: /etc/kubernetes/audit-policy.yaml
                readOnly: true
                pathType: File
              - name: audit-log
                hostPath: /var/log/apiserver
                mountPath: /var/log/apiserver
                readOnly: false
                pathType: DirectoryOrCreate
          controllerManager:
            extraArgs:
              - name: terminated-pod-gc-threshold
                value: "10"
              - name: profiling
                value: "false"
          scheduler:
            extraArgs:
              - name: profiling
                value: "false"
          controlPlaneEndpoint: ${KUBERNETES_HA_IP}:6443
          ---
          apiVersion: kubeadm.k8s.io/v1beta4
          kind: InitConfiguration
          bootstrapTokens:
            - token: "${KUBERNETES_TOKEN}"
              ttl: "24h"
              usages:
                - signing
                - authentication
          certificateKey: "${KUBERNETES_CERTIFICATE_KEY}"
    - path: /etc/kubernetes/admission/event-rate-limit.yaml
      mode: 0600
      contents:
        inline: |
          apiVersion: eventratelimit.admission.k8s.io/v1alpha1
          kind: Configuration
          limits:
            - type: Server
              qps: 5000
              burst: 20000
    - path: /etc/kubernetes/admission/admission-control-config.yaml
      mode: 0600
      contents:
        inline: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: AdmissionConfiguration
          plugins:
            - name: EventRateLimit
              path: /etc/kubernetes/admission/event-rate-limit.yaml
    - path: /etc/kubernetes/encryption/encryption-config.yaml
      mode: 0600
      contents:
        inline: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: EncryptionConfiguration
          resources:
            - resources:
                - secrets
                - configmaps
              providers:
                - aescbc:
                    keys:
                      - name: key1
                        secret: ${KUBERNETES_ENCRYPTION_KEY}
                - identity: {}
    # /etc/keepalived/check_apiserver.sh
    - path: /etc/keepalived/check_apiserver.sh
      mode: 0755
      contents:
        inline: |
          #!/bin/bash
          curl --silent --max-time 2 --insecure https://localhost:6443/healthz -o /dev/null || exit 1
    # /etc/keepalived/keepalived.conf
    - path: /etc/keepalived/keepalived.conf
      mode: 0644
      contents:
        inline: |
          ! /etc/keepalived/keepalived.conf
          ! Configuration File for keepalived
          global_defs {
            router_id LVS_DEVEL
          }
          vrrp_script check_apiserver {
            script "/etc/keepalived/check_apiserver.sh"
            interval 3
            weight -2
            fall 10
            rise 2
          }
          vrrp_instance VI_1 {
            state MASTER
            interface ${INTERFACE}
            virtual_router_id 51
            priority ${KEEPALIVED_PRIORITY}
            authentication {
              auth_type PASS
              auth_pass ${KEEPALIVED_PASSWORD}
            }
            virtual_ipaddress {
              ${KUBERNETES_HA_IP}/${CIDR}
            }
            track_script {
              check_apiserver
            }
          }
    - path: /etc/haproxy/haproxy.cfg
      contents:
        inline: |
          global
            log stdout format raw local0
            daemon

          defaults
            mode                    http
            log                     global
            option                  httplog
            option                  dontlognull
            option http-server-close
            option forwardfor       except 127.0.0.0/8
            option                  redispatch
            retries                 1
            timeout http-request    10s
            timeout queue           20s
            timeout connect         5s
            timeout client          35s
            timeout server          35s
            timeout http-keep-alive 10s
            timeout check           10s

          frontend apiserver
            bind ${KUBERNETES_HA_IP}:6444
            mode tcp
            option tcplog
            default_backend apiserverbackend

          backend apiserverbackend
            mode tcp
            balance     roundrobin

            ${indent(12, HAPROXY_CFG_BACKEND)}
    # noop
    - path: /etc/sysupdate.d/noop.conf
      contents:
        source: https://extensions.flatcar.org/extensions/noop.conf
    # k8s
    - path: /opt/extensions/kubernetes/kubernetes-v${KUBERNETES_VERSION}-x86-64.raw
      contents:
        source: https://extensions.flatcar.org/extensions/kubernetes-v${KUBERNETES_VERSION}-x86-64.raw
    - path: /etc/sysupdate.kubernetes.d/kubernetes-v${KUBERNETES_CONFIG_VERSION}.conf
      contents:
        source: https://extensions.flatcar.org/extensions/kubernetes/kubernetes-v${KUBERNETES_CONFIG_VERSION}.conf
    # cilium
    - path: /opt/extensions/cilium/cilium-v${CILIUM_VERSION}-x86-64.raw
      contents:
        source: https://extensions.flatcar.org/extensions/cilium-v${CILIUM_VERSION}-x86-64.raw
    - path: /etc/sysupdate.cilium.d/cilium.conf
      contents:
        source: https://extensions.flatcar.org/extensions/cilium.conf
    # keepalived
    - path: /opt/extensions/keepalived/keepalived-v${KEEPALIVED_VERSION}-x86-64.raw
      contents:
        source: https://extensions.flatcar.org/extensions/keepalived-v${KEEPALIVED_VERSION}-x86-64.raw
    - path: /etc/sysupdate.keepalived.d/keepalived.conf
      contents:
        source: https://extensions.flatcar.org/extensions/keepalived.conf
  links:
    - path: /etc/extensions/kubernetes.raw
      target: /opt/extensions/kubernetes/kubernetes-v${KUBERNETES_VERSION}-x86-64.raw
      hard: false
    - path: /etc/extensions/cilium.raw
      target: /opt/extensions/cilium/cilium-v${CILIUM_VERSION}-x86-64.raw
      hard: false
    - target: /opt/extensions/keepalived/keepalived-v${KEEPALIVED_VERSION}-x86-64.raw
      path: /etc/extensions/keepalived.raw
      hard: false

systemd:
  units:
    - name: locksmithd.service
      mask: true
    - name: systemd-sysupdate.timer
      enabled: true
    - name: systemd-sysupdate.service
      dropins:
        - name: kubernetes.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C kubernetes update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/kubernetes.raw > /tmp/kubernetes-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/kubernetes /tmp/kubernetes-new; then touch /run/reboot-required; fi"
        - name: cilium.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/cilium.raw > /tmp/cilium"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C cilium update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/cilium.raw > /tmp/cilium-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/cilium /tmp/cilium-new; then touch /run/reboot-required; fi"
        - name: keepalived.conf
          contents: |
            [Service]
            ExecStartPre=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/keepalived.raw > /tmp/keepalived"
            ExecStartPre=/usr/lib/systemd/systemd-sysupdate -C keepalived update
            ExecStartPost=/usr/bin/sh -c "readlink --canonicalize /etc/extensions/keepalived.raw > /tmp/keepalived-new"
            ExecStartPost=/usr/bin/sh -c "if ! cmp --silent /tmp/keepalived /tmp/keepalived-new; then touch /run/reboot-required; fi"

    - name: kubeadm.service
      enabled: true
      contents: |
        [Unit]
        Description=Kubeadm service
        Requires=containerd.service
        After=containerd.service
        After=network-online.target
        ConditionPathExists=!/etc/kubernetes/kubelet.conf
        [Service]
        TimeoutStartSec=infinity
        ExecStartPre=/usr/bin/kubeadm config images pull
        ExecStartPre=/usr/bin/kubeadm init \
                      --config /etc/kubernetes/kubeadm-config.yaml \
                      --skip-phases=addon/kube-proxy \
                      --upload-certs
        ExecStartPre=/usr/bin/mkdir /home/core/.kube
        ExecStartPre=/usr/bin/cp /etc/kubernetes/admin.conf /home/core/.kube/config
        ExecStart=/usr/bin/chown -R core:core /home/core/.kube
        [Install]
        WantedBy=multi-user.target
    - name: kubelet-config-permissions.path
      enabled: true
      contents: |
        [Unit]
        Description=Watch kubelet config.yaml for changes

        [Path]
        PathExists=/var/lib/kubelet/config.yaml
        PathChanged=/var/lib/kubelet/config.yaml
        TriggerLimitIntervalSec=0

        [Install]
        WantedBy=multi-user.target

    - name: kubelet-config-permissions.service
      contents: |
        [Unit]
        Description=Fix kubelet config.yaml permissions
        After=kubelet.service
        StartLimitIntervalSec=0

        [Service]
        Type=oneshot
        ExecStart=/bin/chmod 600 /var/lib/kubelet/config.yaml
        RemainAfterExit=no
    - name: keepalived.service
      enabled: true
    - name: haproxy.service
      enabled: true
      contents: |
        [Unit]
        Description=The Reliable, High Performance TCP/HTTP Load Balancer
        After=docker.service keepalived.service
        Requires=docker.service keepalived.service
        [Service]
        ExecStart=/usr/bin/docker run \
                  --name haproxy \
                  --net=host \
                  --rm \
                  -v /etc/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro \
                  haproxy:alpine
        ExecStop=/usr/bin/docker stop haproxy
        Restart=on-failure
        RestartSec=5s
        [Install]
        WantedBy=multi-user.target
    - name: cilium.service
      enabled: true
      contents: |
        [Unit]
        Description=Install cilium to running k8s cluster
        Documentation=https://docs.cilium.io/en/stable
        Wants=network-online.target kubeadm.service
        Requires=network-online.target kubeadm.service
        After=network-online.target kubeadm.service
        [Service]
        Environment=KUBECONFIG='/home/core/.kube/config'
        ExecStartPre=/usr/bin/bash -c '\
          until nc -z ${KUBERNETES_HA_IP} 6444 2>/dev/null; do \
            sleep 5; \
          done'
        ExecStart=/usr/local/bin/cilium install --set kubeProxyReplacement=true --namespace=kube-system
        [Install]
        WantedBy=multi-user.target
